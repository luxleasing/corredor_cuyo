<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corredor Cuyo · Tramos</title>
  <!-- CSS de MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet">
  <!-- Nuestro CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Panel Superior de KPIs -->
  <div id="panel-kpis">
    
    <!-- Tramo Este -->
    <div class="kpi-card">
      <h2>Tramo Este <span class="subtitulo">(SL-Mza a Palmira)</span></h2>
      <div class="kpi-total">
        <strong id="total-este">—</strong> <span>total</span>
      </div>
      <div class="kpi-detalle">
        <div class="item led"><span class="color-dot"></span> LED: <strong id="led-este">—</strong></div>
        <div class="item sodio"><span class="color-dot"></span> Sodio: <strong id="sodio-este">—</strong></div>
      </div>
    </div>

    <!-- Tramo Oeste -->
    <div class="kpi-card">
      <h2>Tramo Oeste <span class="subtitulo">(Palmira a Las Cuevas)</span></h2>
      <div class="kpi-total">
        <strong id="total-oeste">—</strong> <span>total</span>
      </div>
      <div class="kpi-detalle">
        <div class="item led"><span class="color-dot"></span> LED: <strong id="led-oeste">—</strong></div>
        <div class="item sodio"><span class="color-dot"></span> Sodio: <strong id="sodio-oeste">—</strong></div>
      </div>
    </div>

  </div>

  <!-- Panel de Control (Checkboxes para prender/apagar capas) -->
  <div id="panel-controles">
    <label><input type="checkbox" id="chk-este" checked> Ver Tramo Este</label>
    <label><input type="checkbox" id="chk-oeste" checked> Ver Tramo Oeste</label>
  </div>

  <!-- El Mapa -->
  <div id="mapa"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
