<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corredor Cuyo · Tramos</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header id="app-header">
    <div class="logo-container">
      <img src="logo_lux_byn.png" alt="LuxLeasing" style="height: 28px; width: auto;" onerror="this.style.display='none'">
      <span class="logo-text">LUXLEASING</span>
    </div>
    <div class="header-title">Corredor Cuyo · RN7</div>
    <a href="https://luxleasing.com" target="_blank" class="header-link">luxleasing.com</a>
  </header>

  <!-- CONTROLES DE CAPAS (Botones) -->
  <div id="layer-controls">
    <button id="btn-este" class="active" onclick="toggleLayer('este')">
      <span class="dot led"></span> Tramo Este
    </button>
    <button id="btn-oeste" class="active" onclick="toggleLayer('oeste')">
      <span class="dot sodio"></span> Tramo Oeste
    </button>
  </div>

  <!-- KPIs -->
  <div id="kpi-container">
    <div class="kpi-card">
      <div class="kpi-header">
        <span class="kpi-title">Tramo Este</span>
        <span class="kpi-sub">Límite SL-Mza → Palmira</span>
      </div>
      <div class="kpi-total">
        <strong id="total-este">—</strong> <span>luminarias</span>
      </div>
      <div class="kpi-details">
        <div class="kpi-row"><span class="dot led"></span> LED <strong id="led-este">—</strong></div>
        <div class="kpi-row"><span class="dot sodio"></span> Sodio <strong id="sodio-este">—</strong></div>
        <div class="kpi-row"><span class="dot falta"></span> Falta <strong id="falta-este">—</strong></div>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-header">
        <span class="kpi-title">Tramo Oeste</span>
        <span class="kpi-sub">Palmira → Las Cuevas</span>
      </div>
      <div class="kpi-total">
        <strong id="total-oeste">—</strong> <span>luminarias</span>
      </div>
      <div class="kpi-details">
        <div class="kpi-row"><span class="dot led"></span> LED <strong id="led-oeste">—</strong></div>
        <div class="kpi-row"><span class="dot sodio"></span> Sodio <strong id="sodio-oeste">—</strong></div>
        <div class="kpi-row"><span class="dot falta"></span> Falta <strong id="falta-oeste">—</strong></div>
      </div>
    </div>
  </div>

  <!-- MAPA -->
  <div id="mapa"></div>

  <!-- LEYENDA FLOTANTE -->
  <div id="leyenda">
    <div class="leyenda-item"><span class="dot led"></span> LED</div>
    <div class="leyenda-item"><span class="dot sodio"></span> Sodio</div>
    <div class="leyenda-item"><span class="dot falta"></span> Falta</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
